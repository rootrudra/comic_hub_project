<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>ComicVerse Hub</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <header class="navbar">
        <div class="container" style="display:flex;justify-content:space-between;align-items:center">
            <div class="brand">
                <img src="assets/covers/cartoon-superhero-illustration.jpg" alt="logo" style="height:34px"> ComicVerse Hub
            </div>
            <nav class="nav-links">
                <a href="index.html">Home</a>
                <a href="browse.html">Browse</a>
                <a href="cart.html">Cart (<span id="cart-count">0</span>)</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="header-hero">
            <div class="hero-carousel" id="hero-carousel">
                <!-- slides inserted by JS -->
            </div>
        </section>

        <section class="section" id="new-releases">
            <h2>New Releases</h2>
            <div class="grid grid-cols-3" id="new-grid"></div>
        </section>

        <section class="section" id="popular-series">
            <h2>Popular Series</h2>
            <div class="grid grid-cols-4" id="popular-grid"></div>
        </section>

        <section class="section">
            <h2>Publisher Spotlights</h2>
            <div class="grid grid-cols-3" id="publisher-grid"></div>
        </section>
    </main>

    <footer class="container footer">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:20px">
            <div>© ComicVerse Hub 2025</div>
            <div class="small">Built with HTML, CSS & JavaScript • Static Catalog</div>
        </div>
    </footer>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
    <script>
        // initialize homepage view
        document.addEventListener('DOMContentLoaded', () => {
            HomeUI.init();
            CartUI.renderCount();
        });
    </script>
</body>

</html>
